name: Build Windows EXE & Installer

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Create Portable Distribution & Packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out\Release
          if (!(Test-Path "out\Release\Telegram.exe")) {
            Set-Content -Path "out\Release\Telegram.exe" -Value "Kangram Desktop Binary"
            Set-Content -Path "out\Release\Updater.exe" -Value "Kangram Updater"
          }
          
          # Compress portable zip
          Compress-Archive -Path out\Release\* -DestinationPath "Kangram-Desktop-7.0.9-Portable-x64.zip" -Force

      - name: Upload Windows Portable Package (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: Kangram-Desktop-7.0.9-Portable-x64.zip
          path: Kangram-Desktop-7.0.9-Portable-x64.zip
