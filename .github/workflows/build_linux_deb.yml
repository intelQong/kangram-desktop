name: Build Linux DEB & Portable

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux-amd64:
    name: Build Linux amd64 (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disable unused CLD3 CMake dependency
        run: |
          cat << 'EOF' > cmake/external/cld3/CMakeLists.txt
          add_library(external_cld3 INTERFACE IMPORTED GLOBAL)
          add_library(desktop-app::external_cld3 ALIAS external_cld3)
          EOF
          cat << 'EOF' > Telegram/lib_spellcheck/spellcheck/third_party/language_cld3.cpp
          #include "spellcheck/third_party/language_cld3.h"

          namespace Platform::Language {

          LanguageId Recognize(QStringView text) {
              return {};
          }

          } // namespace Platform::Language
          EOF

      - name: Build C++ Binary in Telegram CentOS Container
        run: |
          mkdir -p out
          chmod -R 777 out
          docker run --rm \
            -u 0:0 \
            -v ${{ github.workspace }}:/usr/src/tdesktop \
            ghcr.io/telegramdesktop/tdesktop/centos_env \
            bash -lc "cd /usr/src/tdesktop/Telegram && ./configure.sh -DDESKTOP_APP_ENABLE_LTO=OFF -DTDESKTOP_API_ID=2040 -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 && cmake --build /usr/src/tdesktop/out --config Release --target Telegram"

      - name: Package Debian Package (amd64)
        run: |
          BINARY="out/Release/AyuGram"
          if [ ! -f "$BINARY" ]; then
            for cand in "out/Release/Telegram" "out/AyuGram" "out/Telegram" "out/bin/AyuGram" "out/bin/Telegram"; do
              if [ -f "$cand" ]; then
                BINARY="$cand"
                break
              fi
            done
          fi
          echo "Found binary at: $BINARY"
          ./debian/build_deb.sh "1.0.1" "amd64" "$BINARY" "."

      - name: Upload amd64 DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kangram-desktop_1.0.1_amd64.deb
          path: kangram-desktop_1.0.1_amd64.deb
