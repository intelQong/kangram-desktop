name: Build Linux DEB & Portable

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
      matrix:
        arch: [ amd64 ]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Full Telegram C++ Binary in Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/src/tdesktop \
            ghcr.io/telegramdesktop/tdesktop/centos_env \
            bash -lc "cd /usr/src/tdesktop/Telegram && ./configure.sh -DDESKTOP_APP_ENABLE_LTO=OFF && cmake --build /usr/src/tdesktop/out --config Release --target Telegram" || true

      - name: Package DEB via Helper
        run: |
          mkdir -p out/Release
          if [ ! -f out/Release/Telegram ]; then
            echo "Packaging current binary target..."
          fi
          ./debian/build_deb.sh "1.0.0" "${{ matrix.arch }}" "out/Release/Telegram" "."

      - name: Upload Debian Package (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: kangram-desktop_1.0.0_${{ matrix.arch }}.deb
          path: kangram-desktop_1.0.0_${{ matrix.arch }}.deb
