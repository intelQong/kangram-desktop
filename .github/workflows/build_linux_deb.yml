name: Build Linux DEB & Portable

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux-amd64:
    name: Build Linux amd64 (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build C++ Binary in Telegram CentOS Container
        run: |
          mkdir -p out
          chmod -R 777 out
          docker run --rm \
            -u 0:0 \
            -v ${{ github.workspace }}:/usr/src/tdesktop \
            ghcr.io/telegramdesktop/tdesktop/centos_env \
            bash -lc "cd /usr/src/tdesktop/Telegram && ./configure.sh -DDESKTOP_APP_ENABLE_LTO=OFF && cmake --build /usr/src/tdesktop/out --config Release --target Telegram"

      - name: Package Debian Package (amd64)
        run: |
          ./debian/build_deb.sh "1.0.0" "amd64" "out/Release/Telegram" "."

      - name: Upload amd64 DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kangram-desktop_1.0.0_amd64.deb
          path: kangram-desktop_1.0.0_amd64.deb
