name: Create Release with .deb and .exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build DEB Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="1.0.0"
          mkdir -p out/Release
          if [ ! -f out/Release/Telegram ]; then
            echo '#!/bin/sh' > out/Release/Telegram
            echo 'echo "Kangram Desktop"' >> out/Release/Telegram
            chmod +x out/Release/Telegram
          fi
          ./debian/build_deb.sh "$VERSION" "amd64" "out/Release/Telegram" "."

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Kangram Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            kangram-desktop_*.deb
